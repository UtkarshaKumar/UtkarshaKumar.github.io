<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460" font-family="Outfit, Helvetica, Arial, sans-serif">
<rect width="800" height="460" fill="#0C0B09"/>
<text x="60" y="44" fill="#EDE8DE" font-size="20" font-weight="600">Conversion goes up. Kept purchases go down.</text>
<text x="60" y="68" fill="#8a857c" font-size="13">Illustration only, not real data</text>
<g stroke="#2a2824" stroke-width="1">
<line x1="80" y1="110" x2="740" y2="110"/><line x1="80" y1="190" x2="740" y2="190"/><line x1="80" y1="270" x2="740" y2="270"/><line x1="80" y1="350" x2="740" y2="350"/>
</g>
<line x1="80" y1="350" x2="740" y2="350" stroke="#55514a"/>
<polyline points="110,300 260,260 410,215 560,175 710,130" fill="none" stroke="#E07840" stroke-width="3"/>
<polyline points="110,150 260,175 410,215 560,260 710,300" fill="none" stroke="#EDE8DE" stroke-width="3" stroke-dasharray="7 5"/>
<g fill="#E07840"><circle cx="110" cy="300" r="4"/><circle cx="260" cy="260" r="4"/><circle cx="410" cy="215" r="4"/><circle cx="560" cy="175" r="4"/><circle cx="710" cy="130" r="4"/></g>
<g fill="#EDE8DE"><circle cx="110" cy="150" r="4"/><circle cx="260" cy="175" r="4"/><circle cx="410" cy="215" r="4"/><circle cx="560" cy="260" r="4"/><circle cx="710" cy="300" r="4"/></g>
<text x="718" y="126" fill="#E07840" font-size="14" text-anchor="end" dy="-8">Conversion</text>
<text x="718" y="320" fill="#EDE8DE" font-size="14" text-anchor="end" dy="10">Kept purchases</text>
<g fill="#8a857c" font-size="13" text-anchor="middle">
<text x="110" y="375">v1</text><text x="260" y="375">v2</text><text x="410" y="375">v3</text><text x="560" y="375">v4</text><text x="710" y="375">v5</text>
<text x="410" y="405">Agent version</text></g>
<text x="40" y="230" fill="#8a857c" font-size="13" text-anchor="middle" transform="rotate(-90 40 230)">Rate</text>
<text x="60" y="440" fill="#8a857c" font-size="12">Each version is tuned to win on conversion. Fewer of the things people buy are kept.</text>
</svg>
